name: wait-jobs skip discriminator
on:
  pull_request:
  push:
    branches: [main]

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlled prerequisite
        run: |
          if [ -f VM2_FORCE_PREP_FAILURE ]; then
            echo "controlled prerequisite failure"
            exit 1
          fi

  security-gate:
    needs: [prep]
    runs-on: ubuntu-latest
    steps:
      - name: Security gate canary
        run: echo "SECURITY_GATE_EXECUTED"

  ci-gate-vuln:
    if: always()
    needs: [security-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}

  ci-gate-control:
    if: always()
    needs: [security-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35
        with:
          jobs: ${{ toJSON(needs) }}
